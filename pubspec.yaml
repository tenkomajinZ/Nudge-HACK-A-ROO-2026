name: nudge
description: A local study companion for getting back on track after a break.
publish_to: none
version: 0.3.0+4
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.9.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.4
flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/recall/
    - assets/branding/nudge-mark.png
